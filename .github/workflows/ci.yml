name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/ProofFlow.Web/package-lock.json

      # The frontend goes first: the .NET build copies wwwroot/build into the output, and a manifest
      # that is not there yet produces an application that starts and renders unstyled.
      - name: Install frontend dependencies
        working-directory: src/ProofFlow.Web
        run: npm ci

      - name: Type-check and build the frontend
        working-directory: src/ProofFlow.Web
        run: npm run build

      - name: Frontend unit tests
        working-directory: src/ProofFlow.Web
        run: npm test

      - name: Restore
        run: dotnet restore ProofFlow.slnx

      - name: Build
        run: dotnet build ProofFlow.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test ProofFlow.slnx --no-build --configuration Release --logger "console;verbosity=normal"

  postgres:
    name: PostgreSQL migrations and integration tests
    runs-on: ubuntu-latest

    # The development and test provider is SQLite, so nothing on a laptop ever runs the PostgreSQL
    # migrations. This job is the only place they are applied before production applies them.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: proofflow
          POSTGRES_PASSWORD: proofflow
          POSTGRES_DB: proofflow
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install dotnet-ef
        run: dotnet tool install --global dotnet-ef --version 10.0.10

      - name: Apply the PostgreSQL migrations
        env:
          ConnectionStrings__Default: 'Host=localhost;Port=5432;Database=proofflow;Username=proofflow;Password=proofflow'
          Database__Provider: postgres
        run: |
          dotnet ef database update \
            --project src/ProofFlow.Infrastructure \
            --startup-project src/ProofFlow.Web \
            --context PostgresProofFlowDbContext

      - name: The model and the migrations agree
        env:
          ConnectionStrings__Default: 'Host=localhost;Port=5432;Database=proofflow;Username=proofflow;Password=proofflow'
          Database__Provider: postgres
        # An empty migration means the last model change was never captured. Building it against a
        # stale assembly would capture the old model instead, so this runs after a real build.
        run: |
          dotnet ef migrations add CiDriftCheck \
            --project src/ProofFlow.Infrastructure \
            --startup-project src/ProofFlow.Web \
            --context PostgresProofFlowDbContext \
            --output-dir Persistence/Migrations/Postgres
          if grep -q "migrationBuilder\." src/ProofFlow.Infrastructure/Persistence/Migrations/Postgres/*CiDriftCheck.cs; then
            echo "::error::The PostgreSQL model has changes with no migration. Run 'dotnet ef migrations add <name>'."
            cat src/ProofFlow.Infrastructure/Persistence/Migrations/Postgres/*CiDriftCheck.cs
            exit 1
          fi

  accessibility:
    name: Accessibility
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/ProofFlow.Web/package-lock.json

      - name: Install frontend dependencies
        working-directory: src/ProofFlow.Web
        run: npm ci

      - name: Build the frontend
        working-directory: src/ProofFlow.Web
        run: npm run build

      - name: Install the browser
        working-directory: src/ProofFlow.Web
        run: npx playwright install --with-deps chromium

      # Started explicitly rather than through Playwright's webServer, so a migration failure or a
      # missing bundle reports itself as a startup failure instead of as a browser timeout.
      - name: Start the application
        working-directory: src/ProofFlow.Web
        env:
          ASPNETCORE_ENVIRONMENT: Development
          ASPNETCORE_URLS: http://localhost:5290
          Demo__Seed: 'true'
          Demo__Password: ${{ github.run_id }}-axe-only-never-deployed
        run: |
          dotnet run --no-launch-profile > /tmp/proofflow.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:5290/healthz > /dev/null; then exit 0; fi
            sleep 2
          done
          echo "::error::The application did not become healthy."
          cat /tmp/proofflow.log
          exit 1

      - name: axe
        working-directory: src/ProofFlow.Web
        env:
          PROOFFLOW_PASSWORD: ${{ github.run_id }}-axe-only-never-deployed
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: src/ProofFlow.Web/playwright-report
          retention-days: 7

  docker:
    name: The container comes up
    runs-on: ubuntu-latest

    # Docker is not on the development machine, so this job is the only place the deployment is
    # actually exercised. It builds the image, brings the stack up exactly as the README says to,
    # and waits for the application to answer — which means the migrations ran against a real
    # PostgreSQL inside the container, not against a laptop's SQLite file.
    steps:
      - uses: actions/checkout@v4

      - name: Configuration, as a first-time reader would write it
        run: |
          cp .env.example .env
          {
            echo "POSTGRES_PASSWORD=$(openssl rand -base64 24)"
            echo "PROOFFLOW_MASTER_KEY=$(openssl rand -base64 32)"
            echo "PROOFFLOW_PORT=8080"
          } >> .env

      - name: Build and start
        run: docker compose up --build --detach --wait --wait-timeout 420

      - name: It answers, and it is the application rather than an error page
        run: |
          curl --fail --silent http://localhost:8080/healthz | tee /dev/stderr | grep -q '"status":"ok"'

          # The sign-in page, because /healthz answers before the pipeline is wired up and a
          # missing asset bundle renders a page that is technically 200 and unusable.
          page=$(curl --fail --silent http://localhost:8080/account/sign-in)
          echo "$page" | grep -q '/build/assets/' \
            || { echo "::error::No built assets on the page — the Vite bundle did not reach the image."; exit 1; }

      - name: What the containers said
        if: always()
        run: docker compose logs --no-color --tail 120

      - name: Stop
        if: always()
        run: docker compose down --volumes

  lint:
    name: Translations and formatting
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # TranslationCompletenessTests is the guard against an English sentence appearing in the
      # middle of a Persian panel, so it gets its own fast job rather than waiting behind the suite.
      - name: Translation catalogues agree
        run: dotnet test tests/ProofFlow.Tests --filter "FullyQualifiedName~TranslationCompleteness"
